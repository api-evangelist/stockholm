name: Stockholm University
x-type: university
x-category: Public Research University
description: >-
  Stockholm University (Stockholms universitet) is a public research university in Sweden and one of
  the country's largest, with roughly 33,000 students across four faculties. It operates no public
  developer portal, no API gateway and no first-party documented API: api.su.se, data.su.se and
  developer.su.se do not resolve, and www.su.se/api returns 404. What the institution genuinely runs
  and serves anonymously is narrow — a Shibboleth SAML2 identity provider at idp.it.su.se whose
  entity metadata is published by the university and registered in the SWAMID federation (and so in
  eduGAIN), the Bolin Centre Database research data repository on bolin.su.se minting its own
  DataCite DOIs under prefix 10.17043 since 2014, and a SiteVision REST sitemap on www.su.se that
  indexes every course syllabus in the education archive. Its two harvestable research surfaces are
  both tenancies rather than SU engineering: the DiVA OAI-PMH endpoint at su.diva-portal.org is
  operated by the DiVA consortium at Uppsala University Library, and su.figshare.com is a Figshare
  deployment. This profile previously credited Stockholm University with eleven APIs that were all
  one Figshare contract at api.figshare.com/v2; those contracts and everything derived from them
  have been removed and the two repository relationships recorded as tenant surfaces instead.
