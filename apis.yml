x-coverage:
  state: none
  reason: no_public_api
  detail: >-
    Stockholm University publishes no public, documented API of its own, and this profile now says
    so. The operator axis is the entire finding. Everything the June 2026 pass credited to SU —
    eleven per-tag OpenAPIs titled "Figshare altmetric ... API", all with servers[0]
    https://api.figshare.com/v2 and info.contact "Figshare Support" — was one vendor contract that
    twelve other institutions in this cohort also ship. Those 48 files (10 refined specs, the
    pristine Figshare source in openapi/_original, the refine report, 3 JSON Schemas, 2 JSON
    Structures, 2 examples, a JSON-LD context, 2 rulesets, a vocabulary, scopes, an authentication
    summary, an agentic-access card, a capability map and 21 collection files) have been removed
    file by file with git rm. Two tenant relationships were kept rather than deleted, because they
    are real institutional facts: the DiVA OAI-PMH endpoint (operated by the DiVA consortium at
    Uppsala University Library) and su.figshare.com. Two institution-operated surfaces were found by
    live probe and are new to this profile: the Shibboleth SAML2 IdP metadata at idp.it.su.se,
    registered in SWAMID and therefore eduGAIN, and the SiteVision /rest-api/sitemap education
    archive index on www.su.se. A third institution-operated asset, the Bolin Centre Database on
    bolin.su.se, mints DataCite DOIs under prefix 10.17043 (DataCite repository snd.bolin, active
    since 2014) but publishes no REST API, so it is recorded as a ResearchRepository pointer and as
    DataCite conformance rather than as an API. Four education-regime domain standards are evidenced
    in conformance/: shibboleth, saml, oai-pmh and datacite. Eight more (scim, lti, oneroster, ed-fi,
    caliper, qti, orcid, crossref) were probed and not found. Absences confirmed by negative probe
    rather than assumed: no developer portal, no API gateway, no open data portal, no llms.txt, no
    sitemap at the conventional path, no first-party security contact (su.se/.well-known/security.txt
    exists but names soc@sitevision.se, the CMS vendor's SOC, not the university's).
  generated: '2026-08-30'
  method: probed
  checked: '2026-08-30'
