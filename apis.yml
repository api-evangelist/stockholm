apis:
- aid: stockholm:diva-oai
  name: DiVA Institutional Repository (OAI-PMH)
  description: >-
    Stockholm University participates in DiVA (Academic Archive On-line), the shared Swedish publishing
    system and digital archive for research and student publications. DiVA exposes bibliographic metadata
    for harvesting via a live OAI-PMH 2.0 endpoint, supporting standard verbs (Identify, ListRecords,
    ListSets, GetRecord) and multiple metadata formats. Confirmed live (HTTP 200).
  humanURL: https://su.diva-portal.org/
  baseURL: https://su.diva-portal.org/dice/oai
  tags:
  - Repository
  - OAI-PMH
  - Metadata
  - Research
  - Open Access
  properties:
  - type: Documentation
    url: https://www.su.se/stockholm-university-library/
- aid: stockholm:shib-keygen-api
  name: shib-keygen-api (Shibboleth SP Metadata Tooling)
  description: >-
    Open-source utility from the Stockholm University GitHub organization that generates Shibboleth SP/SAML2
    metadata X.509 certificates and keys and stores them (e.g. in HashiCorp Vault). Reflects the university's
    SWAMID/Shibboleth (SAML2) federated identity infrastructure. Source is public on GitHub; this is internal
    tooling rather than a consumer-facing hosted API.
  humanURL: https://github.com/stockholmuniversity/shib-keygen-api
  tags:
  - Identity
  - SAML2
  - Shibboleth
  - Authentication
  - Open Source
  properties:
  - type: Documentation
    url: https://github.com/stockholmuniversity/shib-keygen-api
  - type: GitHub
    url: https://github.com/stockholmuniversity/shib-keygen-api
